<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | Swift Style PH</title>
<script src="assets/js/gate.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/db.js"></script>
</head>
<body class="auth-bg">

<div id="site-header"></div>

<main>
  <div class="auth-page">
  <div class="form-box">
    <h2>Log In</h2>
    <p id="error-msg" style="color:var(--danger); margin-bottom:16px; text-align:center; display:none;"></p>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-block">Log In</button>
    </form>
    <div id="social-login"></div>
    <p class="form-note">Don't have an account yet? <a href="register.html">Sign Up</a></p>
  </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error-msg');
    btn.disabled = true;
    const result = await loginUser(email, password);
    btn.disabled = false;

    if (result.ok) {
      window.location.href = safeRedirect(qs('redirect'));
    } else {
      errorEl.textContent = result.error;
      errorEl.style.display = 'block';
    }
  });
  renderSocialButtons('social-login', 'login');
</script>
</body>
</html>
