<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Swift Style PH</title>
<script src="assets/js/gate.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/db.js"></script>
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="section container">
    <h1 class="section-title">Checkout</h1>
    <div id="checkout-content"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  appReady(async function () {
    const content = document.getElementById('checkout-content');
    const directCheckout = qs('direct') === '1';
    let directItem = null;
    let cart = [];
    if (directCheckout) {
      const product = getProductById(Number(qs('product_id')));
      const quantity = Number(qs('quantity'));
      const color = qs('color') || '';
      if (!product || !Number.isSafeInteger(quantity) || quantity < 1 || quantity > product.stock ||
          (product.colors.length > 0 && !color) ||
          (color && !product.colors.includes(color))) {
        content.innerHTML = '<p class="empty-state">This direct checkout link is invalid or the selected item is no longer available. <a href="shop.html">Return to the shop</a>.</p>';
        return;
      }
      directItem = { productId: product.id, quantity: quantity, color: color };
      cart = [{ productId: product.id, qty: quantity, color: color }];
    } else {
      const res = await SSPH_DB.cartList();
      cart = res.ok ? res.data.filter(i => getProductById(i.productId)) : [];
      if (!cart.length) {
        window.location.href = 'cart.html';
        return;
      }
    }

    const user = getCurrentUser() || {};
    const savedAddressResult = await SSPH_DB.mySavedAddresses();
    let savedAddresses = savedAddressResult.ok ? savedAddressResult.data : [];
    const total = cart.reduce((sum, i) => sum + getProductById(i.productId).price * i.qty, 0);

    const summaryLines = cart.map(item => {
      const p = getProductById(item.productId);
      return `<div class="line"><span>${escapeHtml(p.name)}${item.color ? ' (' + escapeHtml(item.color) + ')' : ''} × ${item.qty}</span><span>${formatPrice(p.price * item.qty)}</span></div>`;
    }).join('');

    content.innerHTML = `
      <form id="checkout-form">
        <div class="checkout-layout">
          <div>
            <div class="form-box" style="margin:0 0 24px;">
              <h2 style="text-align:left; font-size:1.3rem;">Shipping Information</h2>
              <p id="checkout-error" style="color:var(--danger); margin-bottom:12px; display:none;"></p>
              <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" value="${escapeHtml(user.fullName || '')}" required>
              </div>
              <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" value="${escapeHtml(user.email || '')}" required>
              </div>
              <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" value="${escapeHtml(user.phone || '')}" placeholder="09XXXXXXXXX" required>
              </div>
              <div class="saved-address-book">
                <h3 class="delivery-address-heading">Saved addresses</h3>
                <p class="form-note" style="text-align:left; margin:0 0 10px;">Save up to five addresses and choose one to fill in checkout.</p>
                <div class="saved-address-controls">
                  <div class="form-group" style="margin:0;">
                    <label for="saved_address_select">Choose an address</label>
                    <select id="saved_address_select">
                      <option value="">Enter an address manually</option>
                      ${savedAddresses.map(function (savedAddress) {
                        return '<option value="' + Number(savedAddress.address_id) + '">' +
                          escapeHtml(savedAddress.label) + ' — ' + escapeHtml(savedAddress.city) + '</option>';
                      }).join('')}
                    </select>
                  </div>
                  <div class="form-group" style="margin:0;">
                    <label for="saved_address_label">Address label</label>
                    <input type="text" id="saved_address_label" maxlength="40" placeholder="Home, Work, etc.">
                  </div>
                </div>
                <div class="saved-address-actions">
                  <button type="button" class="btn btn-secondary" id="save-address-btn">Save address</button>
                  <button type="button" class="btn btn-secondary" id="delete-address-btn" disabled>Delete selected</button>
                </div>
                <p id="saved-address-status" class="saved-address-status" role="status" aria-live="polite">${savedAddressResult.ok ? '' : escapeHtml(savedAddressResult.error)}</p>
              </div>
              <div class="form-group">
                <h3 class="delivery-address-heading">Delivery address</h3>
                <label for="address">Address line</label>
                <input type="text" id="address" maxlength="250" autocomplete="street-address"
                  placeholder="House/building number, street, barangay" value="${escapeHtml(user.address || '')}" required>
              </div>
              <div class="delivery-address-grid">
                <div class="form-group">
                  <label for="city">City / Municipality</label>
                  <input type="text" id="city" maxlength="100" autocomplete="address-level2" required>
                </div>
                <div class="form-group">
                  <label for="province">Province</label>
                  <input type="text" id="province" maxlength="100" autocomplete="address-level1" required>
                </div>
                <div class="form-group">
                  <label for="postal_code">Postal code</label>
                  <input type="text" id="postal_code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4"
                    autocomplete="postal-code" placeholder="4 digits" title="Enter a 4-digit Philippine postal code" required>
                </div>
              </div>
              <div class="form-group">
                <label for="delivery_note">Additional delivery instructions <span class="optional-label">(optional)</span></label>
                <textarea id="delivery_note" rows="3" maxlength="500"
                  placeholder="Landmark, subdivision, gate color, or other details to help the courier find you"></textarea>
              </div>
            </div>

            <div class="form-box" style="margin:0;">
              <h2 style="text-align:left; font-size:1.3rem;">Payment Method</h2>
              <div class="payment-options">
                <label><input type="radio" name="payment_method" value="COD" checked><span>💵 Cash on Delivery (COD)</span></label>
                <label><input type="radio" name="payment_method" value="GCash"><span>📱 GCash</span></label>
                <label><input type="radio" name="payment_method" value="Credit/Debit Card"><span>💳 Credit / Debit Card</span></label>
                <label><input type="radio" name="payment_method" value="Bank Transfer"><span>🏦 Bank Transfer</span></label>
              </div>
            </div>
          </div>

          <div class="order-summary-box">
            <h2 style="font-size:1.3rem; margin-bottom:16px;">Order Summary</h2>
            ${summaryLines}
            <hr style="margin:14px 0; border-color:var(--border);">
            <div class="line"><span>Subtotal</span><span>${formatPrice(total)}</span></div>
            <div class="line"><span>Shipping Fee</span><span>${formatPrice(0)}</span></div>
            <div class="line total" style="font-weight:800; font-size:1.15rem; margin-top:10px;">
              <span>Total</span><span>${formatPrice(total)}</span>
            </div>
            <button type="submit" id="place-btn" class="btn btn-block" style="margin-top:20px;">Place Order</button>
          </div>
        </div>
      </form>`;

    const savedAddressSelect = document.getElementById('saved_address_select');
    const savedAddressLabel = document.getElementById('saved_address_label');
    const savedAddressStatus = document.getElementById('saved-address-status');
    const deleteAddressButton = document.getElementById('delete-address-btn');
    const savedAddressFields = {
      address: document.getElementById('address'),
      city: document.getElementById('city'),
      province: document.getElementById('province'),
      postal_code: document.getElementById('postal_code'),
      delivery_note: document.getElementById('delivery_note')
    };
    function renderSavedAddressOptions(selectedAddressId) {
      savedAddressSelect.innerHTML = '<option value="">Enter an address manually</option>' +
        savedAddresses.map(function (savedAddress) {
          return '<option value="' + Number(savedAddress.address_id) + '">' +
            escapeHtml(savedAddress.label) + ' — ' + escapeHtml(savedAddress.city) + '</option>';
        }).join('');
      savedAddressSelect.value = selectedAddressId ? String(selectedAddressId) : '';
      deleteAddressButton.disabled = !savedAddressSelect.value;
    }
    savedAddressSelect.addEventListener('change', function () {
      const savedAddress = savedAddresses.find(function (item) {
        return String(item.address_id) === savedAddressSelect.value;
      });
      deleteAddressButton.disabled = !savedAddress;
      if (!savedAddress) return;
      savedAddressFields.address.value = savedAddress.address;
      savedAddressFields.city.value = savedAddress.city;
      savedAddressFields.province.value = savedAddress.province;
      savedAddressFields.postal_code.value = savedAddress.postal_code;
      savedAddressFields.delivery_note.value = savedAddress.delivery_note || '';
      savedAddressLabel.value = savedAddress.label;
      savedAddressStatus.textContent = 'Address filled in. You can edit it before placing your order.';
    });
    document.getElementById('save-address-btn').addEventListener('click', async function () {
      const button = this;
      const addressData = {
        label: savedAddressLabel.value.trim(),
        address: savedAddressFields.address.value.trim(),
        city: savedAddressFields.city.value.trim(),
        province: savedAddressFields.province.value.trim(),
        postalCode: savedAddressFields.postal_code.value.trim(),
        deliveryNote: savedAddressFields.delivery_note.value.trim()
      };
      if (!addressData.label) {
        savedAddressStatus.textContent = 'Enter a label such as Home or Work before saving.';
        savedAddressLabel.focus();
        return;
      }
      if (!addressData.address || !addressData.city || !addressData.province || !/^[0-9]{4}$/.test(addressData.postalCode)) {
        savedAddressStatus.textContent = 'Complete the address fields and enter a 4-digit postal code before saving.';
        return;
      }
      button.disabled = true;
      savedAddressStatus.textContent = 'Saving address…';
      const selectedAddressId = savedAddressSelect.value;
      const result = await SSPH_DB.saveMyAddress(selectedAddressId, addressData);
      button.disabled = false;
      if (!result.ok) {
        savedAddressStatus.textContent = result.error;
        return;
      }
      const refreshedAddresses = await SSPH_DB.mySavedAddresses();
      if (!refreshedAddresses.ok) {
        savedAddressStatus.textContent = refreshedAddresses.error;
        return;
      }
      savedAddresses = refreshedAddresses.data;
      renderSavedAddressOptions(result.data);
      savedAddressStatus.textContent = 'Address saved. Choose it from the list to fill checkout next time.';
    });
    deleteAddressButton.addEventListener('click', async function () {
      const selectedAddressId = savedAddressSelect.value;
      if (!selectedAddressId || !window.confirm('Delete this saved address?')) return;
      deleteAddressButton.disabled = true;
      savedAddressStatus.textContent = 'Deleting address…';
      const result = await SSPH_DB.deleteMyAddress(selectedAddressId);
      if (!result.ok) {
        savedAddressStatus.textContent = result.error;
        deleteAddressButton.disabled = false;
        return;
      }
      savedAddresses = savedAddresses.filter(function (item) {
        return String(item.address_id) !== selectedAddressId;
      });
      renderSavedAddressOptions('');
      savedAddressLabel.value = '';
      savedAddressStatus.textContent = 'Saved address deleted.';
    });

    document.getElementById('checkout-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('place-btn');
      const errEl = document.getElementById('checkout-error');
      const requiredFields = ['full_name', 'email', 'phone', 'address', 'city', 'province', 'postal_code'];
      const missingField = requiredFields.find(function (id) {
        return !document.getElementById(id).value.trim();
      });
      if (missingField) {
        const field = document.getElementById(missingField);
        field.setCustomValidity('Please complete this field.');
        field.reportValidity();
        field.addEventListener('input', function clearRequiredError() {
          field.setCustomValidity('');
          field.removeEventListener('input', clearRequiredError);
        });
        return;
      }
      const postalCode = document.getElementById('postal_code');
      if (!/^[0-9]{4}$/.test(postalCode.value.trim())) {
        postalCode.setCustomValidity('Enter a 4-digit Philippine postal code.');
        postalCode.reportValidity();
        postalCode.addEventListener('input', function clearPostalError() {
          postalCode.setCustomValidity('');
          postalCode.removeEventListener('input', clearPostalError);
        });
        return;
      }
      btn.disabled = true;
      errEl.style.display = 'none';
      // The database uses its own prices and checks stock in the same transaction.
      const orderDetails = {
        fullName: document.getElementById('full_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim(),
        city: document.getElementById('city').value.trim(),
        province: document.getElementById('province').value.trim(),
        postalCode: postalCode.value.trim(),
        deliveryNote: document.getElementById('delivery_note').value.trim(),
        paymentMethod: document.querySelector('input[name="payment_method"]:checked').value
      };
      const r = directItem
        ? await SSPH_DB.placeDirectOrder(Object.assign(orderDetails, directItem))
        : await SSPH_DB.placeOrder(orderDetails);
      if (r.ok) {
        window.location.href = 'order-success.html?order_id=' + r.data;
      } else {
        errEl.textContent = r.error;
        errEl.style.display = 'block';
        btn.disabled = false;
        window.scrollTo(0, 0);
      }
    });
  });
</script>
</body>
</html>
