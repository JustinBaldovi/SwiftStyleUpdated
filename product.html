<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Product | Swift Style PH</title>
<script src="assets/js/gate.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/db.js"></script>
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="section container" id="product-section"></section>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  appReady(async function () {
    const productId = Number(qs('id'));
    const product = getProductById(productId);
    const section = document.getElementById('product-section');
  
    if (!product) {
      window.location.href = 'shop.html';
    } else {
      document.getElementById('page-title').textContent = product.name + ' | Swift Style PH';
  
      const related = PRODUCTS.filter(p => p.categoryId === product.categoryId && p.id !== product.id).slice(0, 4);
  
      section.innerHTML = `
        <div class="product-detail">
          <div class="product-detail-img">
            <img id="product-main-img" src="${escapeHtml(productImage(product))}" data-fallback-src="${escapeHtml(productBaseImage(product))}"${productImgClass(product)} alt="${escapeHtml(product.name)}">
          </div>
          <div>
            ${product.isNew ? '<span class="product-badge">NEW</span>' : ''}
            <h1>${escapeHtml(product.name)}</h1>
            <div class="price">${formatPrice(product.price)}</div>
            <p class="desc">${escapeHtml(product.description)}</p>
  
            ${product.stock > 0 ? `
              <p class="stock-note">In stock: ${product.stock} available</p>
              <form id="add-to-cart-form">
                ${product.colors.length ? `
                <div class="option-group">
                  <label>Color: <b id="color-name">${escapeHtml(product.colors[0])}</b></label>
                  <div class="color-options">
                    ${product.colors.map((c, i) => `
                      <label>
                        <input type="radio" name="color" value="${escapeHtml(c)}" ${i === 0 ? 'checked' : ''}>
                        <span><i class="swatch" style="background:${productColorHex(product, c)}"></i>${escapeHtml(c)}</span>
                      </label>`).join('')}
                  </div>
                </div>` : ''}
                <div class="option-group">
                  <label for="quantity">Quantity</label>
                  <input type="number" id="quantity" value="1" min="1" max="${product.stock}" class="qty-input">
                </div>
                <button type="submit" class="btn" id="add-btn">Add to Cart</button>
                <p id="add-msg" style="margin-top:12px; color:var(--success); font-weight:600; display:none;">Added to cart!</p>
              </form>
            ` : `<p class="stock-note" style="color:var(--danger); font-weight:700;">Out of Stock</p>`}
          </div>
        </div>
      `;

      section.insertAdjacentHTML('beforeend', `
        <section class="product-reviews" aria-labelledby="reviews-title">
          <div class="product-reviews-heading">
            <div><h2 id="reviews-title">Customer reviews</h2><p id="reviews-summary">Loading reviews…</p></div>
            <span class="review-live-indicator" id="review-live-indicator">Connecting…</span>
          </div>
          <div class="product-review-columns">
            <form id="review-form" class="review-form">
              <h3>Share your feedback</h3>
              <label for="review-rating">Your rating</label>
              <select id="review-rating" required>
                <option value="5">5 stars — Excellent</option>
                <option value="4">4 stars — Very good</option>
                <option value="3">3 stars — Good</option>
                <option value="2">2 stars — Fair</option>
                <option value="1">1 star — Poor</option>
              </select>
              <label for="review-comment">Comment</label>
              <textarea id="review-comment" rows="2" maxlength="2000" required placeholder="Tell other shoppers about this bag"></textarea>
              <div class="review-form-actions">
                <button type="submit" class="btn" id="submit-review">Submit review</button>
                <span id="review-message" role="status" aria-live="polite"></span>
              </div>
              <small>You can update your review for this product by submitting again.</small>
            </form>
            <div id="product-review-list" class="product-review-list" aria-live="polite"></div>
          </div>
        </section>
      `);

      async function refreshReviews() {
        const result = await SSPH_DB.listProductReviews(product.id);
        const list = document.getElementById('product-review-list');
        const summary = document.getElementById('reviews-summary');
        if (!result.ok) {
          summary.textContent = 'Could not load reviews: ' + result.error;
          list.replaceChildren();
          setReviewLiveStatus('Unavailable', false);
          return;
        }
        const reviews = result.data;
        const average = reviews.length
          ? (reviews.reduce((sum, review) => sum + Number(review.rating), 0) / reviews.length).toFixed(1)
          : '';
        summary.textContent = reviews.length
          ? average + ' out of 5 stars · ' + reviews.length + (reviews.length === 1 ? ' review' : ' reviews')
          : 'No reviews yet. Be the first to share your feedback.';
        list.innerHTML = reviews.map(function (review) {
          return '<article class="product-review">' +
            '<div class="product-review-meta"><span class="review-stars" aria-label="' + Number(review.rating) +
              ' out of 5 stars">' + '★'.repeat(Number(review.rating)) + '☆'.repeat(5 - Number(review.rating)) +
              '</span><span class="review-customer">Customer review</span><time>' +
              escapeHtml(new Date(review.created_at).toLocaleDateString()) + '</time></div>' +
            '<p>' + escapeHtml(review.comment) + '</p></article>';
        }).join('');
      }

      function setReviewLiveStatus(label, connected) {
        const indicator = document.getElementById('review-live-indicator');
        indicator.textContent = label;
        indicator.classList.toggle('connected', connected);
        indicator.classList.toggle('disconnected', !connected);
      }

      async function loadMyReview() {
        const result = await SSPH_DB.getMyProductReview(product.id);
        if (!result.ok) {
          const message = document.getElementById('review-message');
          message.textContent = 'Could not load your existing review: ' + result.error;
          message.className = 'error';
          return;
        }
        if (!result.data) return;
        document.getElementById('review-rating').value = String(result.data.rating);
        document.getElementById('review-comment').value = result.data.comment;
        document.getElementById('submit-review').textContent = 'Update review';
      }

      document.getElementById('review-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const button = document.getElementById('submit-review');
        const message = document.getElementById('review-message');
        button.disabled = true;
        message.textContent = 'Submitting…';
        const result = await SSPH_DB.submitProductReview(
          product.id,
          document.getElementById('review-rating').value,
          document.getElementById('review-comment').value
        );
        button.disabled = false;
        if (!result.ok) {
          message.textContent = result.error;
          message.className = 'error';
          return;
        }
        message.textContent = 'Thank you! Your review has been saved.';
        message.className = 'success';
        button.textContent = 'Update review';
        await refreshReviews();
      });

      refreshReviews();
      loadMyReview();
      const reviewWatch = await SSPH_DB.watchProductReviews(product.id, refreshReviews, function (status) {
        if (status === 'SUBSCRIBED') {
          setReviewLiveStatus('Live updates on', true);
          refreshReviews();
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
          setReviewLiveStatus('Reconnecting · auto-refresh on', false);
        }
      });
      if (!reviewWatch.ok) {
        setReviewLiveStatus('Auto-refresh on', false);
        console.error('[Reviews] Live updates unavailable:', reviewWatch.error);
      }
      window.setInterval(function () {
        if (!document.hidden) refreshReviews();
      }, 15000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) refreshReviews();
      });

      if (related.length) {
        section.insertAdjacentHTML('beforeend',
          '<h2 class="section-title">You May Also <span>Like</span></h2><div class="product-grid" id="related-grid"></div>');
        renderProductGrid('related-grid', related);
      }

      const form = document.getElementById('add-to-cart-form');
      if (form) {
        const mainImg = document.getElementById('product-main-img');
        const fallbackProductImage = function () {
          const fallback = new URL(mainImg.dataset.fallbackSrc, document.baseURI).href;
          if (mainImg.src !== fallback) {
            mainImg.src = mainImg.dataset.fallbackSrc;
          } else {
            mainImg.removeEventListener('error', fallbackProductImage);
          }
        };
        mainImg.addEventListener('error', fallbackProductImage);
        const colorName = document.getElementById('color-name');
        product.colors.forEach(function (color) {
          new Image().src = productImage(product, color);
        });
        form.querySelectorAll('input[name="color"]').forEach(function (radio) {
          radio.addEventListener('change', function () {
            if (colorName) colorName.textContent = radio.value;
            mainImg.classList.add('swapping');
            const next = new Image();
            next.onload = function () {
              mainImg.src = next.src;
              mainImg.alt = product.name + ' - ' + radio.value;
              mainImg.classList.remove('swapping');
            };
            next.onerror = function () {
              mainImg.src = mainImg.dataset.fallbackSrc;
              mainImg.classList.remove('swapping');
            };
            next.src = productImage(product, radio.value);
          });
        });
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          const color = form.querySelector('input[name="color"]:checked');
          const qty = Math.max(1, parseInt(document.getElementById('quantity').value, 10) || 1);
          const msg = document.getElementById('add-msg');
          const btn = document.getElementById('add-btn');
          btn.disabled = true;
          SSPH_DB.cartAdd(product.id, color ? color.value : '', qty).then(function (r) {
            btn.disabled = false;
            msg.style.display = 'block';
            if (r.ok) {
              msg.style.color = 'var(--success)';
              msg.textContent = 'Added to cart!';
              renderHeader();
            } else {
              msg.style.color = 'var(--danger)';
              msg.textContent = r.error;
            }
          });
        });
      }
    }
  });
  window.addEventListener('ssph:catalog-updated', function () {
    window.location.reload();
  });
</script>
</body>
</html>
